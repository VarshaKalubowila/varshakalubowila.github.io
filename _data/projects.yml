featured:
  title: Sense of Agency in an Automated Society
  year: 2024
  categories: [biosignals]
  badges: [EEG, Human–machine interaction]
  url: /projects/sense-of-agency/
  figure_caption: TRIAL · intention → AI drives → key press → tone → rating
  figure_note: Illustrative trace
  summary: >-
    Does explaining an AI's intentions give people back their sense of control?
    Participants supervised an AI driving a car under four levels of explanation.
    I adapted the task to record EEG alongside agency ratings, intentional binding
    and sensory-attenuation catch trials, then ran the pilot.
  meta:
    - label: Lab
      value: Institut Jean Nicod
    - label: Conditions
      value: 4 AI-explanation levels
    - label: EEG
      value: Enobio 20 · 500 S/s

